# Baseline ResNet-50 Configuration for AG-ReID.v2
dataset:
  root: "datasets/AG-ReID.v2"
  height: 256
  width: 128
  num_classes: 590

model:
  name: "resnet50_baseline"
  pretrained: true
  last_stride: 1
  in_features: 2048

sampler:
  num_pids_per_batch: 8      # P = 8 persons
  num_instances_per_pid: 4   # K = 4 images per person
  batch_size: 32             # Total batch size = P * K = 32

loss:
  triplet_margin: 0.3
  weight_id: 1.0             # Cross-Entropy weight
  weight_triplet: 1.0        # Triplet Loss weight

optimizer:
  name: "Adam"
  lr: 0.00035
  weight_decay: 0.0005

training:
  epochs: 1                  # 1 full epoch across all 51,530 images (1,610 iterations)
  eval_period: 1             # Evaluate query & gallery at end of epoch
  checkpoint_dir: "results/checkpoints"
  log_dir: "results/logs"
  num_workers: 0             # 0 is required for macOS sandbox
